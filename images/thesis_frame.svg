<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8B8780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="48" font-size="24" font-weight="600" fill="#1c1b19">One deployment setting, three bottlenecks</text>
  <text x="60" y="74" font-size="14" fill="#6b6661">Unattended camera traps run off-grid on fixed hardware — each constraint shapes one thread of the thesis.</text>

  <!-- Setting band -->
  <rect x="60" y="100" width="880" height="92" rx="16" fill="#F1EFE8" stroke="#C9C4BB" stroke-width="0.8"/>
  <text x="84" y="128" font-size="14" font-weight="600" fill="#2C2C2A">The deployment setting</text>
  <text x="84" y="150" font-size="13" fill="#6b6661">Remote · unattended · no connectivity · fixed edge hardware</text>

  <!-- three constraint chips -->
  <rect x="84" y="160" width="260" height="22" rx="6" fill="#FBEFD9" stroke="#D9A441" stroke-width="0.7"/>
  <text x="214" y="175" font-size="12" font-weight="600" fill="#6b4a0d" text-anchor="middle">Fixed hardware</text>
  <rect x="370" y="160" width="260" height="22" rx="6" fill="#FBEFD9" stroke="#D9A441" stroke-width="0.7"/>
  <text x="500" y="175" font-size="12" font-weight="600" fill="#6b4a0d" text-anchor="middle">No connectivity</text>
  <rect x="656" y="160" width="260" height="22" rx="6" fill="#FBEFD9" stroke="#D9A441" stroke-width="0.7"/>
  <text x="786" y="175" font-size="12" font-weight="600" fill="#6b4a0d" text-anchor="middle">Location-only context</text>

  <!-- arrows down to bottleneck labels -->
  <line x1="214" y1="192" x2="214" y2="232" stroke="#8B8780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="192" x2="500" y2="232" stroke="#8B8780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="786" y1="192" x2="786" y2="232" stroke="#8B8780" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="214" y="216" font-size="12" fill="#6b6661" text-anchor="middle">capacity limit</text>
  <text x="500" y="216" font-size="12" fill="#6b6661" text-anchor="middle">knowledge limit</text>
  <text x="786" y="216" font-size="12" fill="#6b6661" text-anchor="middle">information limit</text>

  <!-- three method cards -->
  <rect x="64" y="240" width="300" height="92" rx="12" fill="#DFF1EA" stroke="#3FA083" stroke-width="0.8"/>
  <text x="214" y="272" font-size="16" font-weight="600" fill="#0F5E48" text-anchor="middle">Efficient adapters</text>
  <text x="214" y="296" font-size="13" fill="#2C7A60" text-anchor="middle">Conditional computation to fit</text>
  <text x="214" y="314" font-size="13" fill="#2C7A60" text-anchor="middle">limited on-device capacity</text>

  <rect x="350" y="240" width="300" height="92" rx="12" fill="#E3E1F7" stroke="#6056C2" stroke-width="0.8"/>
  <text x="500" y="272" font-size="16" font-weight="600" fill="#3C3489" text-anchor="middle">Model distillation</text>
  <text x="500" y="296" font-size="13" fill="#534AB7" text-anchor="middle">Compress large teachers into</text>
  <text x="500" y="314" font-size="13" fill="#534AB7" text-anchor="middle">capable mobile students</text>

  <rect x="636" y="240" width="300" height="92" rx="12" fill="#DFF1EA" stroke="#3FA083" stroke-width="0.8"/>
  <text x="786" y="272" font-size="16" font-weight="600" fill="#0F5E48" text-anchor="middle">Geo conditioning</text>
  <text x="786" y="296" font-size="13" fill="#2C7A60" text-anchor="middle">Use location as the one signal</text>
  <text x="786" y="314" font-size="13" fill="#2C7A60" text-anchor="middle">the field provides</text>

  <!-- arrows down to shared constraint -->
  <line x1="214" y1="332" x2="214" y2="392" stroke="#8B8780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="332" x2="500" y2="392" stroke="#8B8780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="786" y1="332" x2="786" y2="392" stroke="#8B8780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- shared constraint band -->
  <rect x="60" y="400" width="880" height="78" rx="16" fill="#F7E9E6" stroke="#9a3b2e" stroke-width="0.9"/>
  <text x="500" y="432" font-size="15" font-weight="600" fill="#7a2c22" text-anchor="middle">The shared constraint that ties them together</text>
  <text x="500" y="456" font-size="13" fill="#9a3b2e" text-anchor="middle">Every method must compile to a static computation graph — runnable on Apple Neural Engine, NNAPI, and Edge TPU</text>

  <!-- footer -->
  <text x="60" y="512" font-size="11" fill="#9c9a92">Dissertation overview · Emmanuel Azuh Mensah · emazuh.github.io</text>
</svg>
